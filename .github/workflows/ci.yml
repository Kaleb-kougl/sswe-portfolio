name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Follow principle of least privilege. Nothing in this workflow writes to the
# repository any more (see "No snapshot auto-commit" in build-and-test), so the
# default is read-only and no job asks for more.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      # Offline and deterministic (a chars/4 estimate unless a provider key is
      # present), so it belongs with the unit tests. The corpus is what the
      # MCP tools and /fit hand a model whole; the budget is <= 8k tokens.
      - name: Check corpus token budget
        run: npm run corpus:tokens

      - name: Verify Next.js Build
        run: npm run build

      # Next 16 no longer prints "First Load JS" from `next build`, so this
      # measures it from the prerendered .next/server/app/index.html: every
      # <script src> the homepage loads on first paint, gzipped, against the
      # committed budgets/homepage-js.json (+1 KB tolerance). Lazy chunks --
      # the 3D scene, the projectile demo -- are not in that HTML, so moving
      # code behind dynamic() is how you get under it. `--update` rebaselines.
      - name: Check homepage JS budget
        run: node scripts/check-homepage-js.mjs

      # Chromium only: the WebKit and Firefox projects run in the
      # cross-browser job below, so this job no longer downloads them.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No snapshot auto-commit. This job used to re-run the suite with
      # --update-snapshots and commit the result whenever ANY earlier step
      # failed, on PRs included -- so a visual diff could never fail CI, it
      # just became the new baseline. Restricting that to pushes on main was
      # the other option; removing it is cleaner, for three reasons:
      #   - visual-regression.spec.ts skips itself in CI (its baselines are
      #     *-darwin.png; Linux rasterises fonts differently), so the step
      #     had nothing legitimate to update -- it only re-ran e2e and pushed
      #     empty-handed
      #   - were that skip ever lifted, a bot writing baselines to main after
      #     a failure is the same hole moved one merge later: whatever broke
      #     becomes the reference image
      #   - it was the only reason this workflow needed `contents: write`
      # Baselines are updated deliberately, locally, and reviewed in the diff:
      #   npx playwright test e2e/visual-regression.spec.ts --update-snapshots
      - name: Run End-to-End Tests
        run: npm run test:e2e -- --project=desktop-chromium --project=mobile-chromium

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  cross-browser:
    name: Cross-Browser (WebKit, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs /fit (the checker and the chat), the homepage smoke test and the
    # axe/keyboard checks in desktop Safari, an iPhone and Firefox -- the
    # projects scoped by CROSS_BROWSER_SPECS in playwright.config.ts, not the
    # whole suite. Worth a job: /fit is the page's one real interactive
    # feature, and a recruiter opening it from a link is as likely to be on an
    # iPhone as in Chrome. Cheap enough to run on every PR: ~75 tests against
    # the dev server, no build, and in parallel with build-and-test rather
    # than after it (which also keeps that job inside its 15-minute budget).
    # The installs moved, they didn't grow: build-and-test used to download
    # all three browsers with a bare `--with-deps` and use only Chromium.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit firefox

      - name: Run cross-browser End-to-End Tests
        run: npx playwright test --project=desktop-webkit --project=mobile-webkit --project=desktop-firefox

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 14

  web-vitals:
    name: Mid-Range Phone Vitals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own job, not a step in build-and-test, for two reasons. It needs a
    # PRODUCTION server -- `next dev` compiles on request and ships unminified
    # modules, so an LCP measured there is a fact about the dev server -- and
    # Next holds a build lock, so it cannot share a runner with the build that
    # job already does. Running it here gets it a clean machine and a build of
    # its own, and `npm run test:vitals` does both halves in order.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Builds, serves, and measures. The thresholds are Google's published
      # "good" boundaries rather than this build's own numbers, which is what
      # keeps a shared, noisy runner from deciding the result.
      - name: Measure Core Web Vitals under mobile emulation
        run: npm run test:vitals

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-vitals
          path: playwright-report/
          retention-days: 14

  corpus-links:
    name: Corpus Source Links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own job because it is the one check here that depends on the
    # network: it HEADs every `source.href` in src/data/corpus (with retries).
    # A slow or flaky third-party site should turn this job red on its own,
    # not take the unit tests and the build down with it -- and a dead link
    # stays visible as a distinct failure instead of being lost in a log.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check every corpus source link resolves
        run: npm run corpus:links

  asset-budget:
    name: Hero Asset Budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs in parallel with build-and-test and inherits the workflow-level
    # concurrency group. It checks the COMMITTED public/models/hero.glb, so it
    # needs no Blender: GitHub's ubuntu runners do not ship it, and installing
    # it per-run is slow and version-unstable. Rebuilding from scripts/hero.blend
    # is a local / manually-dispatched step -- see hero-rebuild.yml.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci`: scripts/check-hero-budget.mjs parses the GLB container
      # with node: builtins only and has zero dependencies, so installing the
      # tree would be pure latency.
      - name: Check hero.glb against its budgets
        run: npm run hero:check
