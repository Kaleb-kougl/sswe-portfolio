name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Follow principle of least privilege
permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Verify Next.js Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run End-to-End Tests
        run: npm run test:e2e

      - name: Update Snapshots on Failure
        if: failure()
        run: npm run test:e2e -- --update-snapshots

      - name: Commit updated snapshots
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test(e2e): auto-update Playwright visual snapshots"
          file_pattern: "e2e/**/*-snapshots/*"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  asset-budget:
    name: Hero Asset Budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs in parallel with build-and-test and inherits the workflow-level
    # concurrency group. It checks the COMMITTED public/models/hero.glb, so it
    # needs no Blender: GitHub's ubuntu runners do not ship it, and installing
    # it per-run is slow and version-unstable. Rebuilding from scripts/hero.blend
    # is a local / manually-dispatched step -- see hero-rebuild.yml.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci`: scripts/check-hero-budget.mjs parses the GLB container
      # with node: builtins only and has zero dependencies, so installing the
      # tree would be pure latency.
      - name: Check hero.glb against its budgets
        run: npm run hero:check
